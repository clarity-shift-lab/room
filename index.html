<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inner Clarity Room｜Clarity Shift Lab</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;background:#f6f5f2;color:#5c5c5c;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lg{width:100%;max-width:400px;text-align:center}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;color:#454545;letter-spacing:.06em;line-height:1.1}
.logo span{display:block;font-family:"Noto Sans JP",sans-serif;font-size:9.5px;letter-spacing:.26em;color:#9a9a9a;margin-top:4px}
.card{margin-top:28px;background:#fff;border-radius:16px;padding:38px 26px 30px;box-shadow:0 10px 30px rgba(70,90,110,.06)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.18em;color:#6f8ea8;border:1px solid #c8d5df;border-radius:999px;padding:2px 12px}
.badge svg{width:11px;height:11px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:38px;line-height:1.05;color:#454545;margin-top:18px;letter-spacing:.02em}
.lead{font-size:13px;line-height:2;margin-top:16px}
form{margin-top:24px}
input[type=password]{width:100%;border:1px solid #e3e0da;background:#fcfcfb;border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;color:#454545;outline:none;text-align:center;letter-spacing:.08em}
input[type=password]:focus{border-color:#b7c7d4;background:#fff}
.rm{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12.5px;color:#7a7a7a;cursor:pointer}
.rm input{accent-color:#6f8ea8;width:15px;height:15px}
button{margin-top:20px;width:100%;border:0;border-radius:999px;background:#454545;color:#fff;font:inherit;font-size:14px;letter-spacing:.16em;padding:13px;cursor:pointer;transition:background .25s}
button:hover{background:#2f2f2f}
button[disabled]{opacity:.6;cursor:default}
.err{min-height:1.6em;margin-top:12px;font-size:12.5px;color:#b0655a}
.foot{margin-top:22px;font-size:11.5px;line-height:1.9;color:#9a9a9a}
.ck{display:inline-block;white-space:nowrap}
</style>
</head>
<body>
<main class="lg">
  <p class="logo">Clarity Shift Lab<span>MEMBERS</span></p>
  <div class="card">
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Members Only</span>
    <h1>Inner Clarity<br>Room</h1>
    <p class="lead"><span class="ck">メンバー専用ページです。</span><wbr><span class="ck">パスワードを入力してください。</span></p>
    <form id="f" autocomplete="on">
      <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード" required>
      <label class="rm"><input type="checkbox" id="rm" checked>ログインしたままにする</label>
      <button type="submit" id="go">ログイン</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
  <p class="foot"><span class="ck">パスワードが分からない場合は、</span><wbr><span class="ck">公式LINEからお問い合わせください。</span></p>
</main>
